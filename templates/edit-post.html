{% extends 'base.html' %}

{% block content %}

<style>
    form{
        width: 400px;
        margin: 40px auto;
        padding: 20px;
        background: #f5f5f5;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    input, textarea{
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
        width: 100%;
    }

    input[type="submit"]{
        background: #007bff;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
    }

    input[type="submit"]:hover{
        background: #0056b3;
    }
</style>

<form method="post">
    {{ form.csrf_token }}

    {{ form.title.label }}
    {{ form.title() }}

    {{ form.body.label }}
    {{ form.body() }}

    <input type="submit" value="Add Post">
</form>

{% endblock %}
